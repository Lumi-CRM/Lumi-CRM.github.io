<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192-v2.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="application-name" content="LumiCRM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LumiCRM" />
    <meta name="description" content="LumiCRM — облачная CRM для специалистов и команд по недвижимости" />
    <title>LumiCRM</title>
    <script>
      const theme = localStorage.getItem('lumicrm-theme') || 'midnight';
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', !['lumi-light', 'warm-sand'].includes(theme));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
