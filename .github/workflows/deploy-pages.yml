name: Deploy LumiCRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release LumiCRM applications]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - name: Add application installers to the public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/downloads
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'LumiCRM-Windows-Setup.exe' \
            --pattern 'LumiCRM-Android.apk' \
            --dir dist/downloads \
            --clobber
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'latest.yml' \
            --pattern '*.blockmap' \
            --dir dist/downloads \
            --clobber || true
          RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          RELEASE_TIME="$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          RELEASE_VERSION="${RELEASE_TAG#app-v}"
          printf '{"version":"%s","publishedAt":"%s"}\n' "$RELEASE_VERSION" "$RELEASE_TIME" > dist/downloads/version.json
          test -s dist/downloads/LumiCRM-Windows-Setup.exe
          test -s dist/downloads/LumiCRM-Android.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
